<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>火柴人格斗</title>
<style>
  :root{
    color-scheme:dark;
    --control-size:clamp(44px,8.5vmin,72px);
    --control-gap:clamp(5px,1.2vmin,10px);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d0f14;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }
  body{display:flex;align-items:center;justify-content:center}
  #game-shell{
    position:relative;
    width:min(100vw,calc(100vh * 16 / 9));
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:6px;
    box-shadow:0 0 60px rgba(255,120,50,.15);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    background:#0d0f14;
  }
  .touch-controls{
    position:absolute;
    inset:0;
    display:none;
    align-items:flex-end;
    justify-content:space-between;
    padding:
      0 max(10px,env(safe-area-inset-right))
      max(8px,env(safe-area-inset-bottom))
      max(10px,env(safe-area-inset-left));
    pointer-events:none;
  }
  .pause-button{
    position:absolute;
    top:max(clamp(58px,14vh,104px),env(safe-area-inset-top));
    right:max(10px,env(safe-area-inset-right));
    z-index:3;
    min-width:48px;
    min-height:44px;
    padding:0 14px;
    border:1px solid rgba(255,233,200,.72);
    border-radius:10px;
    background:rgba(8,8,14,.76);
    color:#ffe9c8;
    font:700 15px/1 "Microsoft YaHei",system-ui,sans-serif;
    cursor:pointer;
    touch-action:manipulation;
  }
  .pause-button:hover,.pause-button:focus-visible{
    background:#2b1b20;
    outline:2px solid #ffb05e;
    outline-offset:2px;
  }
  .pause-overlay{
    position:absolute;
    inset:0;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(5,5,10,.78);
  }
  .pause-overlay[hidden],.pause-button[hidden]{display:none}
  .pause-panel{
    width:min(390px,88%);
    padding:30px;
    border:2px solid rgba(255,176,94,.68);
    border-radius:14px;
    background:#141018;
    color:#fff;
    text-align:center;
  }
  .pause-panel h2{margin:0 0 8px;color:#ffe9c8;font:800 34px/1.2 "Microsoft YaHei",system-ui,sans-serif}
  .pause-panel p{margin:0 0 22px;color:#d8cfca;font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}
  .touch-pause-hint{display:none}
  html.mobile-mode .desktop-pause-hint{display:none}
  html.mobile-mode .touch-pause-hint{display:inline}
  .pause-actions{display:flex;flex-direction:column;gap:10px}
  .pause-actions button{
    min-height:46px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:9px;
    background:#24202a;
    color:#fff;
    font:700 16px/1 "Microsoft YaHei",system-ui,sans-serif;
    cursor:pointer;
    touch-action:manipulation;
  }
  .pause-actions button:first-child{border-color:#ff9c4a;background:#7b351d}
  .pause-actions button:hover,.pause-actions button:focus-visible{
    background:#45333b;
    outline:2px solid #ffb05e;
    outline-offset:2px;
  }
  html.game-paused .touch-controls{display:none!important}
  .control-pad{
    display:grid;
    grid-template-columns:repeat(3,var(--control-size));
    grid-template-rows:repeat(2,var(--control-size));
    gap:var(--control-gap);
    pointer-events:auto;
  }
  .control-pad--move .touch-key[data-code="KeyW"]{grid-column:2;grid-row:1}
  .control-pad--move .touch-key[data-code="KeyA"]{grid-column:1;grid-row:2}
  .control-pad--move .touch-key[data-code="KeyS"]{grid-column:2;grid-row:2}
  .control-pad--move .touch-key[data-code="KeyD"]{grid-column:3;grid-row:2}
  .touch-key{
    min-width:44px;
    min-height:44px;
    border:1px solid rgba(255,255,255,.42);
    border-radius:12px;
    background:rgba(8,8,14,.58);
    color:#fff;
    font:700 clamp(11px,2.4vmin,16px)/1 "Microsoft YaHei",system-ui,sans-serif;
    text-shadow:0 1px 2px #000;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  .touch-key span{
    display:block;
    margin-top:4px;
    color:rgba(255,255,255,.72);
    font-size:.72em;
    font-weight:500;
  }
  .touch-key[data-code="KeyJ"]{border-color:#ff6a5e;background:rgba(112,22,20,.72)}
  .touch-key[data-code="KeyK"]{border-color:#ffd75e;background:rgba(105,76,12,.72)}
  .touch-key[data-code="KeyI"],
  .touch-key[data-code="KeyO"]{border-color:#7edfff;background:rgba(13,74,96,.72)}
  .touch-key.is-active{
    transform:scale(.92);
    background:rgba(255,255,255,.30);
    border-color:#fff;
  }
  .rotate-hint{
    position:fixed;
    inset:0;
    z-index:2;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    background:#0d0f14;
    color:#ffe9c8;
    text-align:center;
    font:700 20px/1.5 "Microsoft YaHei",system-ui,sans-serif;
  }
  .rotate-hint span{display:block;color:rgba(255,255,255,.68);font-size:14px;font-weight:400}
  html.mobile-mode .touch-controls{display:flex}
  @media (orientation:portrait){
    html.mobile-mode .rotate-hint{display:flex}
    html.mobile-mode .touch-controls{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .touch-key{transition:none}
  }
</style>
</head>
<body>
<main id="game-shell" aria-label="火柴人格斗游戏">
  <canvas id="c" width="1280" height="720" aria-label="火柴人格斗画面"></canvas>
  <button id="pause-toggle" class="pause-button" type="button" aria-label="暂停游戏" hidden>暂停</button>
  <div class="touch-controls" aria-label="手机触控键位">
    <div class="control-pad control-pad--move" aria-label="移动和防御">
      <button class="touch-key" data-code="KeyW" aria-label="向上和招式派生">W<span>上</span></button>
      <button class="touch-key" data-code="KeyA" aria-label="向左移动">A<span>左</span></button>
      <button class="touch-key" data-code="KeyS" aria-label="防御和向下派生">S<span>防</span></button>
      <button class="touch-key" data-code="KeyD" aria-label="向右移动">D<span>右</span></button>
    </div>
    <div class="control-pad control-pad--action" aria-label="战斗操作">
      <button class="touch-key" data-code="KeyU" aria-label="技能">U<span>技</span></button>
      <button class="touch-key" data-code="KeyI" aria-label="必杀">I<span>必杀</span></button>
      <button class="touch-key" data-code="KeyO" aria-label="大招">O<span>大招</span></button>
      <button class="touch-key" data-code="KeyL" aria-label="瞬移">L<span>闪</span></button>
      <button class="touch-key" data-code="KeyK" aria-label="跳跃">K<span>跳</span></button>
      <button class="touch-key" data-code="KeyJ" aria-label="普通攻击和确认">J<span>攻击</span></button>
    </div>
  </div>
  <section id="pause-overlay" class="pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="pause-panel">
      <h2 id="pause-title">战斗暂停</h2>
      <p><span class="desktop-pause-hint">按 Esc 或 P 可以继续战斗</span><span class="touch-pause-hint">点击“继续战斗”即可返回</span></p>
      <div class="pause-actions">
        <button id="pause-resume" type="button">继续战斗</button>
        <button id="pause-restart" type="button">重新开始本场</button>
        <button id="pause-select" type="button">返回选人</button>
      </div>
    </div>
  </section>
</main>
<div class="rotate-hint" role="status">
  请将手机横过来
  <span>横屏后会显示虚拟键位</span>
</div>
<script src="game.js?v=5"></script>
</body>
</html>
